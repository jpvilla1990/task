- name: Disable root SSH login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin'
    line: 'PermitRootLogin no'
  notify: Restart SSH

- name: Disable SSH password authentication
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^\s*#?\s*PasswordAuthentication\s+'
    line: 'PasswordAuthentication no'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart SSH

- name: Create admin users
  ansible.builtin.user:
    name: "{{ item.username }}"
    shell: /bin/bash
    create_home: true
    groups: "sudo"
    append: true
    state: present
  loop: "{{ admin_users }}"

- name: Create .ssh directory for admin users
  ansible.builtin.file:
    path: "/home/{{ item.username }}/.ssh"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: '0700'
  loop: "{{ admin_users }}"

- name: Add SSH public keys for admin users
  ansible.posix.authorized_key:
    user: "{{ item }}"
    key: "{{ hostvars['localhost'][item ~ '_public_key'] }}" # Dynamic construct the key using the usernames
    state: present
  loop: "{{ admin_users }}"