- name: Resolve architecture
  ansible.builtin.set_fact:
    common_ne_arch: "{{ common_docker_arch_map[ansible_facts['architecture']] }}"
    common_ne_dir: "node_exporter-{{ common_node_exporter_version }}.linux-{{ common_docker_arch_map[ansible_facts['architecture']] }}"

- name: Create node_exporter system group
  ansible.builtin.group:
    name: node_exporter
    system: true

- name: Create node_exporter system user (no shell, no home)
  ansible.builtin.user:
    name: node_exporter
    group: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Working directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: "0755"
  loop:
    - { path: /opt/node_exporter }
    - { path: /opt/node_exporter/releases }
    - { path: /var/lib/node_exporter, owner: node_exporter }
    - { path: /var/lib/node_exporter/textfile, owner: node_exporter }
  loop_control:
    label: "{{ item.path }}"

- name: Download release (sha256 pinned)
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ common_node_exporter_version }}/{{ common_ne_dir }}.tar.gz"
    dest: "/opt/node_exporter/releases/{{ common_ne_dir }}.tar.gz"
    checksum: "sha256:{{ common_node_exporter_checksums[common_ne_arch] }}"
    mode: "0644"

- name: Unpack release
  ansible.builtin.unarchive:
    src: "/opt/node_exporter/releases/{{ common_ne_dir }}.tar.gz"
    dest: /opt/node_exporter/releases
    remote_src: true
    creates: "/opt/node_exporter/releases/{{ common_ne_dir }}/node_exporter"

- name: Install binary
  ansible.builtin.copy:
    src: "/opt/node_exporter/releases/{{ common_ne_dir }}/node_exporter"
    dest: /usr/local/bin/node_exporter
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart node_exporter

- name: Install node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart node_exporter

- name: Flush handlers so the unit is known before it is enabled
  ansible.builtin.meta: flush_handlers

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
