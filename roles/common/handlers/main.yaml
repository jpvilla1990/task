- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Restart auditd
  ansible.builtin.service:
    name: auditd
    state: restarted
  when: not common_container_mode

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: not common_container_mode

- name: Reload ufw
  community.general.ufw:
    state: reloaded
  listen: Reload ufw

- name: Reload sysctl
  ansible.builtin.command: sysctl -p
  changed_when: false
  listen: Reload sysctl

- name: Restart node_exporter
  ansible.builtin.service:
    name: node_exporter
    state: restarted
  when: not common_container_mode
  listen: Restart node_exporter

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: not common_container_mode
  listen: Reload systemd