dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: ubuntu
    image: ubuntu:24.04
    dockerfile: dockerfile
    pre_build_image: false
    command: sleep infinity
    capabilities:
      - NET_ADMIN
      - NET_RAW

provisioner:
  name: ansible
  inventory:
    links:
      group_vars: ../../inventories/prod/group_vars/

verifier:
  name: ansible